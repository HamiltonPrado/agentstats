# Compila a AgentStats e corre os testes a cada push e pull request.
# - Em cada execução, a app compilada fica em Actions → Artifacts (30 dias).
# - Ao enviar uma tag de versão (ex.: v1.9), publica também uma Release com a app, que não expira.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Um push novo cancela a execução anterior do mesmo branch (poupa minutos de macOS).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # necessário para criar a Release nas tags

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Versão do Swift
        run: swift --version

      - name: Versão da app
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
            # a tag tem de corresponder ao ficheiro VERSION, para não publicar uma versão trocada
            if [[ "$v" != "$(cat VERSION)" ]]; then
              echo "::error::A tag $GITHUB_REF_NAME não corresponde ao ficheiro VERSION ($(cat VERSION))"; exit 1
            fi
          else
            v="$(cat VERSION)"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Testes
        run: ./test.sh

      - name: Compilar a app
        run: VERSION="${{ steps.version.outputs.version }}" BUILD_NUMBER="${{ github.run_number }}" ./build.sh

      - name: Teste de arranque
        # Abre a app (modo de capturas, ~7 s) para apanhar crashes ao arrancar que os testes não veem.
        run: build/AgentStats.app/Contents/MacOS/AgentStats --snapshot "$RUNNER_TEMP"

      - name: Empacotar
        run: ditto -c -k --keepParent build/AgentStats.app AgentStats.zip

      - name: Publicar a app (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: AgentStats-${{ github.sha }}
          path: AgentStats.zip
          retention-days: 30

      - name: Publicar a Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" AgentStats.zip \
            --title "AgentStats ${{ steps.version.outputs.version }}" \
            --generate-notes

      - name: Atualizar o cask do Homebrew
        # Põe a versão e o sha256 do zip acabado de publicar em Casks/agentstats.rb, no main.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="${{ steps.version.outputs.version }}"
          sha=$(shasum -a 256 AgentStats.zip | cut -d' ' -f1)
          git fetch --depth 1 origin main
          git checkout -B main FETCH_HEAD
          sed -i '' -E "s/^  version \".*\"/  version \"$v\"/; s/^  sha256 \".*\"/  sha256 \"$sha\"/" Casks/agentstats.rb
          if git diff --quiet; then echo "Cask já está em $v"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: cask $v"
          git push origin main
